# Complete TaskFlow Pro + CI/CD Dashboard - Docker Compose
# This file sets up EVERYTHING needed for full deployment demonstration
# Run with: docker-compose up -d

version: '3.8'

services:
  # ==========================================================
  # MONGODB DATABASE - For TaskFlow Pro data persistence
  # ==========================================================
  mongodb:
    image: mongo:7-jammy
    container_name: taskflow-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: taskflow123
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-network

  # ==========================================================
  # TASKFLOW PRO - FRONTEND (Stable/Production)
  # ==========================================================
  taskflow-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: stable
        VITE_DEPLOYMENT_STRATEGY: standard
    image: ruthik005/taskflow-frontend:stable
    container_name: taskflow-frontend
    ports:
      - "3001:80"
    depends_on:
      - taskflow-api
    networks:
      - taskflow-network
    labels:
      - "deployment.version=stable"
      - "deployment.strategy=standard"

  # ==========================================================
  # TASKFLOW PRO - API BACKEND (Stable/Production)
  # ==========================================================
  taskflow-api:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        APP_VERSION: stable
        DEPLOYMENT_STRATEGY: standard
    image: ruthik005/taskflow-api:stable
    container_name: taskflow-api
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_VERSION=stable
      - DEPLOYMENT_STRATEGY=standard
      - MONGO_URI=mongodb://admin:taskflow123@mongodb:27017/taskflow?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskflow-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "deployment.version=stable"
      - "deployment.strategy=standard"

  # ==========================================================
  # BLUE VERSION - For Blue-Green Deployment Demo
  # ==========================================================
  taskflow-frontend-blue:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: blue
        VITE_DEPLOYMENT_STRATEGY: blue-green
    image: ruthik005/taskflow-frontend:blue
    container_name: taskflow-frontend-blue
    ports:
      - "3003:80"
    profiles:
      - blue-green
    networks:
      - taskflow-network
    labels:
      - "deployment.version=blue"
      - "deployment.strategy=blue-green"

  taskflow-api-blue:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        APP_VERSION: blue
        DEPLOYMENT_STRATEGY: blue-green
    image: ruthik005/taskflow-api:blue
    container_name: taskflow-api-blue
    ports:
      - "3004:3000"
    environment:
      - APP_VERSION=blue
      - DEPLOYMENT_STRATEGY=blue-green
      - MONGO_URI=mongodb://admin:taskflow123@mongodb:27017/taskflow?authSource=admin
    profiles:
      - blue-green
    depends_on:
      - mongodb
    networks:
      - taskflow-network
    labels:
      - "deployment.version=blue"
      - "deployment.strategy=blue-green"

  # ==========================================================
  # GREEN VERSION - For Blue-Green Deployment Demo
  # ==========================================================
  taskflow-frontend-green:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: green
        VITE_DEPLOYMENT_STRATEGY: blue-green
    image: ruthik005/taskflow-frontend:green
    container_name: taskflow-frontend-green
    ports:
      - "3005:80"
    profiles:
      - blue-green
    networks:
      - taskflow-network
    labels:
      - "deployment.version=green"
      - "deployment.strategy=blue-green"

  taskflow-api-green:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        APP_VERSION: green
        DEPLOYMENT_STRATEGY: blue-green
    image: ruthik005/taskflow-api:green
    container_name: taskflow-api-green
    ports:
      - "3006:3000"
    environment:
      - APP_VERSION=green
      - DEPLOYMENT_STRATEGY=blue-green
      - MONGO_URI=mongodb://admin:taskflow123@mongodb:27017/taskflow?authSource=admin
    profiles:
      - blue-green
    depends_on:
      - mongodb
    networks:
      - taskflow-network
    labels:
      - "deployment.version=green"
      - "deployment.strategy=blue-green"

  # ==========================================================
  # CANARY VERSION - For Canary Deployment Demo
  # ==========================================================
  taskflow-frontend-canary:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: canary
        VITE_DEPLOYMENT_STRATEGY: canary
    image: ruthik005/taskflow-frontend:canary
    container_name: taskflow-frontend-canary
    ports:
      - "3007:80"
    profiles:
      - canary
    networks:
      - taskflow-network
    labels:
      - "deployment.version=canary"
      - "deployment.strategy=canary"
      - "canary.weight=10"

  # ==========================================================
  # CI/CD APP (Original Pipeline App)
  # ==========================================================
  ci-cd-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ruthik005/ci-cd-app:latest
    container_name: ci-cd-app
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - APP_VERSION=latest
    networks:
      - taskflow-network

# ==========================================================
# VOLUMES & NETWORKS
# ==========================================================
volumes:
  mongodb_data:
    name: taskflow-mongodb-data

networks:
  taskflow-network:
    driver: bridge
    name: taskflow-network
